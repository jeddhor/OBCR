[workspace]
resolver = "3"
members = ["crates/*", "tools/obc-tool", "xtask"]
default-members = ["crates/obcr"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.95"
publish = false

[workspace.dependencies]
obc-audio = { path = "crates/obc-audio" }
obc-core = { path = "crates/obc-core" }
obc-formats = { path = "crates/obc-formats" }
obc-net = { path = "crates/obc-net" }
obc-platform = { path = "crates/obc-platform" }
obc-render = { path = "crates/obc-render" }
obc-sim = { path = "crates/obc-sim" }
obc-testdata = { path = "crates/obc-testdata" }
obc-ui = { path = "crates/obc-ui" }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
hound = "3.5.1"
nuked-opl3 = "0.1.0"
png = "0.18.1"
proptest = "1.12.0"
sdl3 = { version = "0.22.0", features = ["build-from-source-static"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
overflow-checks = true
opt-level = 1

# Dependencies (SDL, PNG encoding, hashing) are fast even in debug builds.
[profile.dev.package."*"]
opt-level = 3

[profile.test]
overflow-checks = true

[profile.release]
lto = "thin"
codegen-units = 4
